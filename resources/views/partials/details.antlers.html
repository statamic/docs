{{ details }}
<div class="c-pill-with-description">
    <header>
        <h3>
            {{ name }}
        </h3>
        <div>
            {{ type }}
        </div>
        {{ if required }}
            <div>required</div>
        {{ /if }}
    </header>
    <div>
        {{ description | markdown | widont }}
    </div>
</div>
{{ /details }}
